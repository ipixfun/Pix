                    <div><label class="block font-sans text-[11px] font-bold text-neonGreen mb-1 pl-3" x-text="lang === 'id' ? 'NOMOR WHATSAPP //' : 'WHATSAPP NUMBER //'"></label><input type="tel" id="phone" placeholder="08xxxx" required class="w-full bg-darkBg border border-neonGreen/20 focus:border-neonGreen focus:outline-none py-2.5 px-4 font-cyber text-white text-xs rounded-full transition-all duration-300 hover:shadow-neonHover"></div>
                    <div><label class="block font-sans text-[11px] font-bold text-neonGreen mb-1 pl-3" x-text="lang === 'id' ? 'UMUR //' : 'AGE //'"></label><select id="age" required class="w-full bg-darkBg border border-neonGreen/20 focus:border-neonGreen focus:outline-none py-2.5 px-4 font-cyber text-white text-xs rounded-full transition-all duration-300 hover:shadow-neonHover cursor-pointer appearance-none sm:appearance-auto"><option value="" disabled selected class="bg-cardBg text-gray-500" x-text="lang === 'id' ? 'Umur Berapa ?' : 'How old?'"></option><script>for(let i=30;i<=100;i++){document.write(`<option value="${i}" class="bg-cardBg text-white">${i}</option>`);}</script></select></div>
                    <div><label class="block font-sans text-[11px] font-bold text-neonGreen mb-1 pl-3" x-text="lang === 'id' ? 'ASAL //' : 'ORIGIN //'"></label><input type="text" id="origin" placeholder="Kota / Daerah" required class="w-full bg-darkBg border border-neonGreen/20 focus:border-neonGreen focus:outline-none py-2.5 px-4 font-cyber text-white text-xs rounded-full transition-all duration-300 hover:shadow-neonHover"></div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block font-sans text-[11px] font-bold text-neonGreen mb-1 pl-3" x-text="lang === 'id' ? 'STATUS //' : 'STATUS //'"></label><select id="status" required class="w-full bg-darkBg border border-neonGreen/20 focus:border-neonGreen focus:outline-none py-2.5 px-4 font-cyber text-white text-xs rounded-full transition-all duration-300 hover:shadow-neonHover cursor-pointer appearance-none sm:appearance-auto"><option value="" disabled selected class="bg-cardBg text-gray-500" x-text="lang === 'id' ? 'Pilih Status' : 'Select Status'"></option><option value="Beristri" class="bg-cardBg text-white" x-text="lang === 'id' ? 'Beristri' : 'Married'"></option><option value="Duda" class="bg-cardBg text-white" x-text="lang === 'id' ? 'Duda' : 'Widowed'"></option><option value="Single" class="bg-cardBg text-white">Single</option></select></div>
                    <div><label class="block font-sans text-[11px] font-bold text-neonGreen mb-1 pl-3" x-text="lang === 'id' ? 'ROLE PILIHAN //' : 'PREFERRED ROLE //'"></label><select id="role" required class="w-full bg-darkBg border border-neonGreen/20 focus:border-neonGreen focus:outline-none py-2.5 px-4 font-cyber text-white text-xs rounded-full transition-all duration-300 hover:shadow-neonHover cursor-pointer appearance-none sm:appearance-auto"><option value="" disabled selected class="bg-cardBg text-gray-500" x-text="lang === 'id' ? 'Pilih Role' : 'Select Role'"></option><option value="T" class="bg-cardBg text-white">T</option><option value="B" class="bg-cardBg text-white">B</option><option value="V" class="bg-cardBg text-white">V</option><option value="Side" class="bg-cardBg text-white">Side</option></select></div>

                <div><label class="block font-sans text-[11px] font-bold text-neonGreen mb-1 pl-3" x-text="lang === 'id' ? 'PESAN //' : 'MESSAGE //'"></label><textarea id="message" rows="3" required class="w-full bg-darkBg border border-neonGreen/20 focus:border-neonGreen focus:outline-none p-4 font-cyber text-white text-xs rounded-2xl transition-all duration-300 hover:shadow-neonHover"></textarea></div>
                <div class="text-center pt-2"><button type="submit" class="font-cyber inline-block border border-neonGreen text-neonGreen px-6 py-2.5 text-[11px] sm:text-xs font-bold tracking-widest hover:bg-neonGreen hover:text-black transition-all duration-300 shadow-neon hover:shadow-neonHover rounded-full cursor-pointer w-full sm:w-auto" x-text="lang === 'id' ? 'kirim ke whatsapp' : 'send to whatsapp'"></button></div>

        <footer class="py-6 text-center text-[9px] sm:text-[10px] font-cyber border-t border-neonGreen/10 text-gray-600 z-10 relative px-4">&copy; 2026 pix.chaser</footer>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let currentEffect = 'matrix'; // DIBUBAH KE MATRIX
        let lightnings = [];
        let fontSize = 14;
        let columns = Math.floor(window.innerWidth / fontSize);
        let drops = Array(columns).fill(1);
        let matrixChars = "PIX ".split(""); 

        function runMatrixMode() {
            ctx.fillStyle = 'rgba(10, 15, 13, 0.03)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                let text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]+=0.55 + Math.random()*0.25;
            }
        }

        function createLightningPath(startX, startY, endY) {
            let path = [{ x: startX, y: startY }];
            let currentX = startX;
            let currentY = startY;
            while (currentY < endY) {
                currentX += (Math.random() - 0.5) * 60;
                currentY += Math.random() * 30 + 15;
                path.push({ x: currentX, y: currentY });
            }
            return path;
        }

        function runLightningMode() {
            ctx.fillStyle = 'rgba(10, 15, 13, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (Math.random() > 0.95 && lightnings.length < 3) {
                let startX = Math.random() * canvas.width;
                let endY = canvas.height * (Math.random() * 0.7 + 0.3);
                lightnings.push({ path: createLightningPath(startX, 0, endY), alpha: 1.0, width: Math.random() * 3 + 1, fadeOutSpeed: Math.random() * 0.06 + 0.04 });
            }
            for (let i = lightnings.length - 1; i >= 0; i--) {
                let bolt = lightnings[i];
                ctx.beginPath();
                ctx.moveTo(bolt.path[0].x, bolt.path[0].y);
                for (let j = 1; j < bolt.path.length; j++) ctx.lineTo(bolt.path[j].x, bolt.path[j].y);
                ctx.strokeStyle = `rgba(0, 255, 102, ${bolt.alpha})`;
                ctx.lineWidth = bolt.width;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ff66';
                ctx.stroke();
                bolt.alpha -= bolt.fadeOutSpeed;
                if (bolt.alpha <= 0) lightnings.splice(i, 1);
            }
            ctx.shadowBlur = 0;
        }

        function animate() {
            if (currentEffect === 'lightning') runLightningMode();
            else runMatrixMode();
            requestAnimationFrame(animate);
        }
        animate();

        document.addEventListener('click', (e) => {
            if (['INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'A'].includes(e.target.tagName)) return;
            currentEffect = (currentEffect === 'lightning') ? 'matrix' : 'lightning';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        let typed;
        function initTyped(text) {
            if (typed) typed.destroy();
            typed = new Typed('#typing-effect', { strings: [text], typeSpeed: 30, startDelay: 400, showCursor: true, cursorChar: '|', loop: false });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const initialText = "Seorang chaser yang antusias fokus pada chubby, karakter gemoy, dan montok.";
            initTyped(initialText);
            if (window.Alpine) {
                Alpine.watch(() => Alpine.$data(document.body).lang, (newLang) => {
                    const newText = newLang === 'id' 
                        ? "Seorang chaser yang antusias fokus pada chubby, karakter gemoy, dan montok." 
                        : "An enthusiastic chaser focusing on chubby, cute, and plump characters.";
                    initTyped(newText);
                });
            }
        });
        
        const follower = document.getElementById('audio-follower');
        window.addEventListener('mousemove', (e) => { follower.style.opacity = "1"; follower.style.left = e.clientX + 'px'; follower.style.top = e.clientY + 'px'; });
        
        function sendToWhatsApp(event) {
            event.preventDefault();
            const myPhoneNumber = "628567776162";
            const name = document.getElementById('name').value;
            const senderPhone = document.getElementById('phone').value;
            const age = document.getElementById('age').value;
            const origin = document.getElementById('origin').value;
            const status = document.getElementById('status').value;
            const role = document.getElementById('role').value;
            const message = document.getElementById('message').value;
            const isId = Alpine.$data(document.body).lang === 'id';
            const titleHeader = isId ? '*Ada Pesan Baru dari chubby*' : '*New Message from chubby*';
            const text = `Halo Pix,%0A%0A${titleHeader}%0A--------------------------------%0A👤 *${isId ? 'Nama' : 'Name'}:* ${encodeURIComponent(name)}%0A📞 *${isId ? 'No. Pengirim' : 'Sender No'}:* ${encodeURIComponent(senderPhone)}%0A🎂 *${isId ? 'Umur' : 'Age'}:* ${encodeURIComponent(age)} ${isId ? 'Tahun' : 'Years'}%0A📍 *${isId ? 'Asal' : 'Origin'}:* ${encodeURIComponent(origin)}%0A💍 *${isId ? 'Status' : 'Status'}:* ${encodeURIComponent(status)}%0A🎭 *${isId ? 'Role nya' : 'Role'}:* ${encodeURIComponent(role)}%0A💬 *${isId ? 'Pesan' : 'Message'}:* ${encodeURIComponent(message)}%0A--------------------------------`;
            window.open(`https://wa.me/${myPhoneNumber}?text=${text}`, '_blank');
        }
    </script>
